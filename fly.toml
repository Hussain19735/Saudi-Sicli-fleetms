# fly.toml app configuration file generated for saudi-sicli-fleetms-mzpy1w on 2026-11-17T16:40:37Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'saudi-sicli-fleetms-mzpy1w'
primary_region = 'ams'
kill_signal = 'SIGTERM'

[build]
[deploy]
  release_command = '/app/bin/migrate'

[env]
  PHX_HOST = 'saudi-sicli-fleetms-mzpy1w.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 256
